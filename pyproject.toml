[project]
name = "costwise"
version = "0.1.0"
description = "Optimizer agent that lowers the cost of a target AI app and proves quality did not drop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "tenacity>=9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.scripts]
costwise = "costwise.apps.cli.main:main"

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2",
    "pre-commit>=4",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costwise"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "PLR", "SIM", "RUF", "ANN", "S", "T20", "D1"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
packages = ["costwise"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--disable-socket --cov=costwise --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["costwise"]
relative_files = true
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = false
fail_under = 80

[tool.importlinter]
root_package = "costwise"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["costwise.domain"]
forbidden_modules = [
    "costwise.ports",
    "costwise.services",
    "costwise.adapters",
    "costwise.bootstrap",
    "costwise.apps",
]

[[tool.importlinter.contracts]]
name = "ports depend only on domain"
type = "forbidden"
source_modules = ["costwise.ports"]
forbidden_modules = [
    "costwise.services",
    "costwise.adapters",
    "costwise.bootstrap",
    "costwise.apps",
]

[[tool.importlinter.contracts]]
name = "services do not touch adapters or apps"
type = "forbidden"
source_modules = ["costwise.services"]
forbidden_modules = ["costwise.adapters", "costwise.bootstrap", "costwise.apps"]

[[tool.importlinter.contracts]]
name = "adapters do not touch services or apps"
type = "forbidden"
source_modules = ["costwise.adapters"]
forbidden_modules = ["costwise.services", "costwise.bootstrap", "costwise.apps"]

[[tool.importlinter.contracts]]
name = "domain and services stay free of I/O libraries"
type = "forbidden"
source_modules = ["costwise.domain", "costwise.services"]
forbidden_modules = [
    "httpx",
    "boto3",
    "botocore",
    "opentelemetry",
    "yaml",
    "typer",
    "requests",
]
